version: 2
updates:
  # Keeps the actions in .github/workflows, pinned by commit, up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # PR titles must follow Conventional Commits (.github/workflows/pr-title.yml)
    commit-message:
      prefix: ci
