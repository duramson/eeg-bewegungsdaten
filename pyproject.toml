[project]
name = "eeg-bewegungsdaten"
version = "0.1.0.dev0"
description = "Download, archive and clean the EEG-Bewegungsdaten (per-plant EEG payments) of the four German TSOs and match them with the Marktstammdatenregister"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Cedrik Theesen" }]
requires-python = ">=3.10"
keywords = [
    "energy",
    "renewables",
    "eeg",
    "erneuerbare-energien-gesetz",
    "netztransparenz",
    "marktstammdatenregister",
    "mastr",
    "open-data",
    "polars",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "polars>=1.20",
    "rich>=13.7",
]

[project.scripts]
eeg-bewegungsdaten = "eeg_bewegungsdaten.cli:main"

[project.urls]
Repository = "https://github.com/duramson/eeg-bewegungsdaten"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "eeg_bewegungsdaten"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.mypy]
strict = true
files = ["src", "tests", "analysis", ".github/scripts"]

[dependency-groups]
dev = [
    "jsonschema>=4.22",
    "mypy>=2.4.0",
    "oemetadata>=2.0.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
